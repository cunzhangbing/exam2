<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四川事业编 冲刺148工作台 V7.1</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #fafafa;
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #96D1E8;
            --primary-dark: #6ebcd9;
            --pink-accent: #E88A9A;
            --pink-dark: #d96f82;
            --success-text: #ffffff;
            --danger-text: #FFEB3B;
            --warn-bg: #fff8e1;
            --warn-border: #ffd54f;
            --warn-text: #b7791f;
            --alert-bg: #ffebee;
            --alert-border: #ef9a9a;
            --alert-text: #c62828;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        
        body {
            background: linear-gradient(135deg, rgba(232,138,154,0.15) 0%, rgba(150,209,232,0.15) 100%);
            color: #333; padding-bottom: 90px; min-height: 100vh;
        }

        /* 顶部纯色状态看板 */
        #overview {
            padding: 22px 18px; text-align: center;
            border-bottom-left-radius: 22px; border-bottom-right-radius: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            color: white; transition: background-color 0.4s ease;
        }
        .bg-incomplete { background-color: var(--primary); }
        .bg-complete { background-color: var(--pink-accent); }
        
        #date-display { font-size: 13px; opacity: 0.92; margin-bottom: 8px; font-weight: bold; }
        #quote-msg { font-size: 19px; margin: 8px 0; letter-spacing: 1px; font-weight: 900; text-shadow: 1px 1px 4px rgba(0,0,0,0.28); }
        .daily-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 4px 0; }
        #daily-progress { font-size: 30px; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.2); }
        .edit-daily-btn {
            background: rgba(255,255,255,0.25); color: white; border: 1px solid rgba(255,255,255,0.5);
            border-radius: 12px; padding: 3px 9px; font-size: 11px; font-weight: bold; cursor: pointer;
        }
        .total-progress { font-size: 13px; margin-top: 8px; opacity: 0.95; line-height: 1.5; }

        .hp-container { margin: 12px auto; width: 100%; max-width: 350px; background: rgba(0,0,0,0.2); border-radius: 10px; position: relative; overflow: hidden; height: 20px; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #ff7e5f, #feb47b); width: 100%; transition: width 0.5s; }
        .hp-text { position: absolute; width: 100%; text-align: center; color: white; font-size: 11px; line-height: 20px; font-weight: bold; top: 0; left: 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.6); }

        .container { padding: 14px 14px 0 14px; }

        /* 每日勾选与周期提醒 */
        .routine-card {
            background: var(--card-bg); border-radius: 14px; padding: 14px;
            margin-bottom: 14px; box-shadow: 0 4px 12px rgba(150,209,232,0.18);
            border: 1px solid rgba(255,255,255,0.8);
        }
        .section-head { font-size: 14px; font-weight: bold; color: #444; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .check-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
        .check-pill {
            display: flex; align-items: center; justify-content: center; gap: 5px;
            padding: 10px 6px; border-radius: 10px; font-size: 13px; font-weight: bold;
            background: #f4f7f9; color: #666; border: 1px solid #e2e8f0; cursor: pointer;
            transition: all 0.2s; user-select: none;
        }
        .check-pill.done { background: rgba(232,138,154,0.18); color: var(--pink-dark); border-color: var(--pink-accent); }
        
        .alert-strip {
            padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: bold;
            margin-top: 6px; display: flex; justify-content: space-between; align-items: center;
        }
        .strip-ok { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .strip-warn { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
        .strip-alert { background: var(--alert-bg); color: var(--alert-text); border: 1px solid var(--alert-border); }

        .report-btn {
            width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px; border: none;
            background: linear-gradient(90deg, var(--primary-dark), var(--pink-accent));
            color: white; font-size: 12px; font-weight: bold; cursor: pointer;
        }

        /* 148分红线总看板 */
        .score-banner {
            background: var(--card-bg); border-radius: 14px; padding: 14px;
            margin-bottom: 14px; box-shadow: 0 4px 12px rgba(232,138,154,0.18);
            border: 1px solid rgba(232,138,154,0.4); text-align: center;
        }
        .score-banner-title { font-size: 12px; color: #666; margin-bottom: 6px; }
        .score-big { font-size: 26px; font-weight: 900; color: var(--pink-dark); margin-bottom: 4px; }
        .score-sub { font-size: 12px; color: #555; }
        .score-gap { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .gap-need { background: #fff3e0; color: #e65100; }
        .gap-pass { background: #e8f5e9; color: #2e7d32; }

        /* 模块卡片 */
        .card { background: var(--card-bg); border-radius: 12px; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(150,209,232,0.14); overflow: hidden; border: 1px solid rgba(255,255,255,0.85); }
        .card-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .card-left { flex: 1; min-width: 0; }
        .card-title { font-size: 15px; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; color: #333; flex-wrap: wrap; }
        .tag-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: normal; }
        .tag-zc { background: rgba(232,138,154,0.18); color: var(--pink-dark); }
        .tag-gj { background: rgba(150,209,232,0.25); color: #2b7a9b; }
        .card-stats { font-size: 12px; color: #888; margin-bottom: 7px; }
        
        .progress-bar-bg { width: 100%; height: 6px; background: #eef1f5; border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary-dark); transition: width 0.3s; }
        .progress-bar-fill.zc-fill { background: var(--pink-accent); }
        
        .sub-list { background: rgba(250,252,255,0.9); padding: 10px 14px; border-top: 1px solid #f0f0f0; display: none; }
        .sub-list.active { display: block; }
        .sub-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px dashed #e5e7eb; }
        .sub-item:last-child { border-bottom: none; }
        .sub-name { font-size: 13px; color: #444; }
        .sub-stat { font-size: 12px; color: #888; margin-right: 10px; white-space: nowrap; }
        .add-btn { background: var(--primary-dark); color: white; border: none; width: 28px; height: 28px; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
        .edit-sub-btn { width: 100%; padding: 7px; background: white; border: 1px solid var(--primary); color: var(--primary-dark); border-radius: 6px; font-size: 12px; margin-bottom: 8px; cursor: pointer; }

        /* 计算器与模考卡片 */
        .calc-card { background: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(232,138,154,0.14); border: 1px solid rgba(232,138,154,0.35); overflow: hidden; }
        .calc-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; text-align: center; color: var(--pink-dark); }
        
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
        .calc-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .calc-item { display: flex; flex-direction: column; font-size: 10px; color: #555; align-items: center; min-width: 0; }
        .calc-item input { width: 100%; min-width: 0; padding: 8px 2px; border: 1px solid #ddd; border-radius: 6px; margin-top: 4px; text-align: center; font-size: 13px; background: #fff; }
        
        .btn-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .calc-btn { flex: 1; min-width: 0; padding: 11px 4px; background: var(--pink-accent); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .chart-btn { flex: 1; min-width: 0; padding: 11px 4px; background: var(--primary-dark); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .hist-btn { width: 100%; padding: 9px; background: #f6f8fa; color: #666; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 12px; margin-bottom: 4px; cursor: pointer; }
        
        .mock-input-row { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; }
        .mock-input-row input { flex: 1; min-width: 0; width: 100%; padding: 10px 6px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 13px; background: #fff; }

        .history-list { display: none; margin-top: 6px; border-top: 1px dashed #ddd; padding-top: 8px; max-height: 200px; overflow-y: auto; }
        .history-list.active { display: block; }
        .hist-row { display: flex; justify-content: space-between; font-size: 12px; padding: 8px 4px; border-bottom: 1px solid #f2f2f2; color: #555; }
        .hist-date { color: #888; font-weight: bold; width: 52px; flex-shrink: 0; }
        .hist-scores { flex: 1; text-align: right; }

        /* 归档与备份区 */
        .archive-card { background: rgba(245,247,250,0.95); border-radius: 14px; padding: 14px; margin-bottom: 14px; border: 1px dashed #cbd5e1; }
        .archive-body { display: none; margin-top: 10px; font-size: 12px; color: #64748b; line-height: 1.7; }
        .archive-body.active { display: block; }
        .backup-textarea { width: 100%; height: 68px; margin-top: 8px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px; font-family: monospace; }

        /* 弹窗 */
        .modal { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top-left-radius: 20px
