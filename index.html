<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>考研/考试 极简工作台 V5</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            var(--bg-color): #fafafa;
            --card-bg: rgba(255, 255, 255, 0.9);
            --primary: #96D1E8;      
            --primary-dark: #6ebcd9;
            --pink-accent: #E88A9A;  
            --success-text: #ffffff; 
            --danger-text: #FFEB3B;  
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, rgba(232,138,154,0.15) 0%, rgba(150,209,232,0.15) 100%); 
            color: #333; padding-bottom: 80px; min-height: 100vh;
        }
        
        #overview {
            padding: 25px 20px; text-align: center;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            color: white; transition: background-color 0.4s ease;
        }
        
        .bg-incomplete { background-color: var(--primary); }
        .bg-complete { background-color: var(--pink-accent); }
        
        #date-display { font-size: 14px; opacity: 0.9; margin-bottom: 10px; font-weight: bold;}
        #quote-msg { font-size: 20px; margin: 10px 0; letter-spacing: 1px; font-weight: 900; text-shadow: 1px 1px 4px rgba(0,0,0,0.3);}
        #daily-progress { font-size: 32px; font-weight: bold; margin: 5px 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.2);}
        .total-progress { font-size: 14px; margin-top: 10px; opacity: 0.9; }

        .hp-container { margin: 15px auto; width: 100%; max-width: 350px; background: rgba(0,0,0,0.2); border-radius: 10px; position: relative; overflow: hidden; height: 20px; box-shadow: inset 0 0 5px rgba(0,0,0,0.3);}
        .hp-fill { height: 100%; background: linear-gradient(90deg, #ff7e5f, #feb47b); width: 100%; transition: width 0.5s; }
        .hp-text { position: absolute; width: 100%; text-align: center; color: white; font-size: 12px; line-height: 20px; font-weight: bold; top: 0; left: 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.6);}

        .container { padding: 15px; }
        .card { background: var(--card-bg); border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(150,209,232,0.15); overflow: hidden; border: 1px solid rgba(255,255,255,0.6); backdrop-filter: blur(5px);}
        .card-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .card-left { flex: 1; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; color: #444;}
        .card-stats { font-size: 12px; color: #888; margin-bottom: 8px; }
        
        .progress-bar-bg { width: 100%; height: 6px; background: #eef1f5; border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary-dark); transition: width 0.3s; }
        
        .sub-list { background: rgba(255,255,255,0.6); padding: 10px 15px; border-top: 1px solid #f0f0f0; display: none; }
        .sub-list.active { display: block; }
        .sub-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #ddd; }
        .sub-item:last-child { border-bottom: none; }
        .sub-name { font-size: 14px; color: #555; }
        .sub-stat { font-size: 12px; color: #888; margin-right: 10px; }
        .add-btn { background: var(--primary-dark); color: white; border: none; width: 28px; height: 28px; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(150,209,232,0.5); }
        .edit-sub-btn { width: 100%; padding: 8px; background: white; border: 1px solid var(--primary); color: var(--primary-dark); border-radius: 6px; font-size: 13px; margin-bottom: 10px; cursor: pointer;}

        .calc-card { background: rgba(255,255,255,0.85); border-radius: 12px; padding: 16px; margin-top: 20px; box-shadow: 0 4px 12px rgba(232,138,154,0.15); border: 1px solid rgba(232,138,154,0.3);}
        .calc-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; text-align: center; color: var(--pink-accent); }
        
        /* 手机防溢出 4列自适应网格 */
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 15px; }
        .calc-item { display: flex; flex-direction: column; font-size: 10px; color: #555; align-items: center;}
        .calc-item input { width: 100%; padding: 6px 2px; border: 1px solid #ddd; border-radius: 4px; margin-top: 4px; text-align: center; font-size:12px; background: #fff;}
        
        .btn-group { display: flex; gap: 8px; margin-bottom: 10px;}
        .calc-btn { flex: 1; padding: 10px 4px; background: var(--pink-accent); color: white; border: none; border-radius: 6px; font-size:12px; font-weight: bold; box-shadow: 0 2px 6px rgba(232,138,154,0.4);}
        .chart-btn { flex: 1; padding: 10px 4px; background: var(--primary-dark); color: white; border: none; border-radius: 6px; font-size:12px; font-weight: bold; box-shadow: 0 2px 6px rgba(150,209,232,0.4);}
        .hist-btn { width: 100%; padding: 8px; background: #f5f5f5; color: #666; border: 1px solid #ddd; border-radius: 6px; font-size:12px; margin-bottom: 10px;}
        
        .mock-input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .mock-input-row input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; text-align: center;}

        /* 下拉历史记录清单 */
        .history-list { display: none; margin-top: 10px; border-top: 1px dashed #ddd; padding-top: 10px; max-height: 180px; overflow-y: auto;}
        .history-list.active { display: block; }
        .hist-row { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 5px; border-bottom: 1px solid #f0f0f0; color: #555;}
        .hist-date { color: #888; font-weight: bold; width: 55px;}
        .hist-scores { flex:1; text-align: right; letter-spacing: 0.5px;}

        .modal { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.3, 1); z-index: 100; max-height: 85vh; overflow-y: auto;}
        .modal.active { transform: translateY(0); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 99; backdrop-filter: blur(2px);}
        .modal-overlay.active { display: block; }
        
        .chart-container { position: relative; height: 300px; width: 100%; margin-bottom: 15px;}
        
        .quick-add-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .quick-btn { padding: 12px; background: rgba(150,209,232,0.15); border: none; border-radius: 8px; font-size: 16px; color: var(--primary-dark); font-weight: bold; }
        .close-btn { width: 100%; padding: 12px; background: #f0f0f0; border: none; border-radius: 8px; font-size: 16px; margin-top: 10px; color: #555;}
        .target-input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px;}
        .target-input-row input { width: 60px; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        .save-btn { width: 100%; padding: 12px; background: var(--primary-dark); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="overview" class="bg-incomplete">
        <div id="date-display"></div>
        <div class="hp-container">
            <div class="hp-fill" id="hp-fill"></div>
            <div class="hp-text" id="hp-text">计算中...</div>
        </div>
        <h1 id="quote-msg">行百里者半九十 😭</h1>
        <div id="daily-progress">0.0 / 0.0 h</div>
        <div class="total-progress">全局总进度: <span id="total-done">0</span> / <span id="total-target">225</span> 小时</div>
    </div>

    <div class="container" id="module-list"></div>

    <div class="container">
        <!-- 自动估分正确率打卡 -->
        <div class="calc-card">
            <div class="calc-title">📝 正确率估分器 (动态加权)</div>
            
            <div style="font-weight:bold; font-size:12px; margin-bottom:5px; color:#444;">公基卷测算(%)</div>
            <div class="calc-grid">
                <div class="calc-item">法律(24%) <input type="number" id="gj-law" placeholder="如:80"></div>
                <div class="calc-item">政治(20%) <input type="number" id="gj-pol" placeholder="%"></div>
                <div class="calc-item">职测(14.4) <input type="number" id="gj-calc" placeholder="%"></div>
                <div class="calc-item">公文(8.8%) <input type="number" id="gj-doc" placeholder="%"></div>
                <div class="calc-item">经济(5.8%) <input type="number" id="gj-econ" placeholder="%"></div>
                <div class="calc-item">科技(9.4%) <input type="number" id="gj-sci" placeholder="%"></div>
                <div class="calc-item">时政(1.8%) <input type="number" id="gj-cur" placeholder="%"></div>
            </div>

            <div style="font-weight:bold; font-size:12px; margin-bottom:5px; margin-top:10px; color:#444;">职测卷测算(%)</div>
            <div class="calc-grid">
                <div class="calc-item">言语(28%) <input type="number" id="zc-yy" placeholder="%"></div>
                <div class="calc-item">常识(17.5) <input type="number" id="zc-cs" placeholder="%"></div>
                <div class="calc-item">图形(9%) <input type="number" id="zc-tx" placeholder="%"></div>
                <div class="calc-item">定义(4%) <input type="number" id="zc-dy" placeholder="%"></div>
                <div class="calc-item">类比(6%) <input type="number" id="zc-lb" placeholder="%"></div>
                <div class="calc-item">逻辑(4.5%) <input type="number" id="zc-lj" placeholder="%"></div>
                <div class="calc-item">资料(20%) <input type="number" id="zc-zl" placeholder="%"></div>
                <div class="calc-item">数量(11%) <input type="number" id="zc-sl" placeholder="%"></div>
            </div>
            
            <div class="btn-group">
                <button class="calc-btn" onclick="saveAndCalcRates()">保存算分</button>
                <button class="chart-btn" onclick="showChart('rate')">📈 历史折线</button>
            </div>
            <button class="hist-btn" onclick="toggleHistory('rate')">🔽 展开/收起 预测分历史明细</button>
            <div id="rate-history-list" class="history-list"></div>
        </div>

        <!-- 真实模考成绩打卡 -->
        <div class="calc-card">
            <div class="calc-title">🏆 真实套卷模考成绩记录</div>
            <div class="mock-input-row">
                <input type="number" id="mock-gj" placeholder="公基分数">
                <input type="number" id="mock-zc" placeholder="职测分数">
            </div>
            <div class="btn-group">
                <button class="calc-btn" onclick="saveMockScore()">记录成绩</button>
                <button class="chart-btn" onclick="showChart('mock')">📈 分数折线</button>
            </div>
            <button class="hist-btn" onclick="toggleHistory('mock')">🔽 展开/收起 模考分数明细</button>
            <div id="mock-history-list" class="history-list"></div>
        </div>
    </div>

    <!-- 弹窗遮罩 -->
    <div class="modal-overlay" id="overlay" onclick="closeAllModals()"></div>
    
    <div class="modal" id="time-modal">
        <div class="modal-title" id="time-modal-title" style="font-weight:bold; text-align:center; margin-bottom:15px;">记录时长</div>
        <div class="quick-add-grid">
            <button class="quick-btn" onclick="commitTime(0.5)">+ 0.5h</button>
            <button class="quick-btn" onclick="commitTime(1.0)">+ 1.0h</button>
            <button class="quick-btn" onclick="commitTime(2.0)">+ 2.0h</button>
        </div>
        <button class="close-btn" onclick="closeAllModals()">取消</button>
    </div>

    <div class="modal" id="target-modal">
        <div class="modal-title" id="target-modal-title" style="font-weight:bold; text-align:center; margin-bottom:15px;">调整细分目标时间</div>
        <div id="target-input-list"></div>
        <button class="save-btn" onclick="saveTargets()">保存并核算总盘</button>
        <button class="close-btn" onclick="closeAllModals()">取消</button>
    </div>

    <div class="modal" id="chart-modal">
        <div class="chart-container">
            <canvas id="myCanvas"></canvas>
        </div>
        <button class="close-btn" onclick="closeAllModals()">关闭图表</button>
    </div>

    <script>
        const scheduleData = {'10-29': 4.5, '10-30': 3.0, '10-31': 8.5, '11-01': 8.5, '11-02': 3.5, '11-03': 2.5, '11-04': 0.0, '11-05': 2.5, '11-06': 1.0, '11-07': 6.5, '11-08': 6.5, '11-09': 1.5, '11-10': 4.5, '11-11': 2.5, '11-12': 4.5, '11-13': 3.0, '11-14': 8.5, '11-15': 8.5, '11-16': 3.5, '11-17': 4.5, '11-18': 2.5, '11-19': 4.5, '11-20': 3.0, '11-21': 8.5, '11-22': 8.5, '11-23': 3.5, '11-24': 4.5, '11-25': 2.5, '11-26': 4.5, '11-27': 3.0, '11-28': 8.5, '11-29': 8.5, '11-30': 3.5, '12-01': 4.5, '12-02': 2.5, '12-03': 2.5, '12-04': 1.0, '12-05': 6.5, '12-06': 6.5, '12-07': 1.5, '12-08': 2.5, '12-09': 0.0, '12-10': 4.5, '12-11': 3.0, '12-12': 8.5, '12-13': 8.5, '12-14': 3.5, '12-15': 4.5, '12-16': 2.5, '12-17': 4.5, '12-18': 3.0, '12-19': 8.5, '12-20': 8.5};
        
        const todayObj = new Date();
        const mm = (todayObj.getMonth()+1).toString().padStart(2, '0');
        const dd = todayObj.getDate().toString().padStart(2, '0');
        const dateKey = `${mm}-${dd}`;
        const dailyTarget = scheduleData[dateKey] !== undefined ? scheduleData[dateKey] : 0.0;

        // V5 保留了所有旧数据密钥
        let modules = JSON.parse(localStorage.getItem('examModulesV4'));
        if (!modules) {
            let oldData = JSON.parse(localStorage.getItem('examModulesV3')) || JSON.parse(localStorage.getItem('examModulesV2')) || JSON.parse(localStorage.getItem('examModules')); 
            modules = [
                { id: 1, name: "法律", target: 60, current: 0, subs: [{name:"学习-刑法", t:6, c:0}, {name:"刷题-刑法", t:6, c:0}, {name:"学习-民法", t:6, c:0}, {name:"刷题-民法", t:6, c:0}, {name:"学习-行政法", t:6, c:0}, {name:"刷题-行政法", t:6, c:0}, {name:"学习-宪法", t:6, c:0}, {name:"刷题-宪法", t:6, c:0}, {name:"学习-其他", t:6, c:0}, {name:"刷题-其他", t:6, c:0}]},
                { id: 2, name: "政治", target: 50, current: 0, subs: [{name:"学习-马哲", t:5, c:0}, {name:"刷题-马哲", t:5, c:0}, {name:"学习-中特", t:5, c:0}, {name:"刷题-中特", t:5, c:0}, {name:"学习-时政", t:5, c:0}, {name:"刷题-时政", t:5, c:0}, {name:"学习-党史", t:5, c:0}, {name:"刷题-党史", t:5, c:0}, {name:"学习-毛概", t:5, c:0}, {name:"刷题-毛概", t:5, c:0}]},
                { id: 3, name: "公文及常识", target: 15, current: 0, subs: [{name:"公文及常识", t:15, c:0}] },
                { id: 4, name: "资料分析", target: 35, current: 0, subs: [{name:"日度练习", t:15, c:0}, {name:"板块刷题", t:20, c:0}] },
                { id: 5, name: "言语与数量", target: 15, current: 0, subs: [{name:"言语理解", t:4, c:0}, {name:"数量关系", t:4, c:0}, {name:"判断推理", t:4, c:0}, {name:"其他", t:3, c:0}] },
                { id: 6, name: "全真套卷模考", target: 50, current: 0, subs: [{name:"公基卷", t:25, c:0}, {name:"职测卷", t:25, c:0}] }
            ];
            if (oldData) {
                oldData.forEach(oldM => {
                    let match = modules.find(m => m.id === oldM.id || (m.id===4 && oldM.name.includes("资料分析")));
                    if (match && oldM.current > 0) match.subs.push({name: "🚨历史记录(已扣除)", t: 0, c: oldM.current});
                });
            }
            localStorage.setItem('examModulesV4', JSON.stringify(modules));
        }

        let todayStr = new Date().toLocaleDateString();
        let storedDate = localStorage.getItem('lastDateV4');
        let todayLogged = parseFloat(localStorage.getItem('todayLoggedV4')) || 0;
        if (storedDate !== todayStr) { todayLogged = 0; localStorage.setItem('lastDateV4', todayStr); localStorage.setItem('todayLoggedV4', 0); }

        let actMod = null; let actSub = null;
        let rateHistory = JSON.parse(localStorage.getItem('rateHistoryV4')) || { gj: [], zc: [], labels: [] };
        let mockHistory = JSON.parse(localStorage.getItem('mockHistoryV4')) || { gj: [], zc: [], labels: [] };
        let myChart = null;

        const rateInputs = ['gj-law','gj-pol','gj-calc','gj-doc','gj-econ','gj-sci','gj-cur','zc-yy','zc-cs','zc-tx','zc-dy','zc-lb','zc-lj','zc-zl','zc-sl'];
        rateInputs.forEach(id => {
            let saved = localStorage.getItem('save_'+id);
            if(saved) document.getElementById(id).value = saved;
        });

        function updateDatesAndHP() {
            const today = new Date();
            const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            document.getElementById('date-display').innerText = `${today.getMonth()+1}月${today.getDate()}日 ${days[today.getDay()]}`;
            
            const start = new Date('2026-10-29T00:00:00');
            const end = new Date('2026-12-20T00:00:00');
            const total = Math.ceil((end - start)/(1000*60*60*24));
            const left = Math.ceil((end - today)/(1000*60*60*24));
            
            let hp = Math.min(100, Math.max(0, (left / total) * 100));
            document.getElementById('hp-fill').style.width = hp + '%';
            document.getElementById('hp-text').innerText = `距考试 还有 ${Math.max(0, left)} 天 (生命值 ${hp.toFixed(1)}%)`;
        }

        function render() {
            const list = document.getElementById('module-list');
            list.innerHTML = '';
            let totalDone = 0, totalTarget = 0;

            modules.forEach((mod, mIndex) => {
                mod.target = mod.subs.reduce((acc, sub) => acc + (parseFloat(sub.t)||0), 0);
                mod.current = mod.subs.reduce((acc, sub) => acc + (parseFloat(sub.c)||0), 0);
                totalDone += mod.current; totalTarget += mod.target;

                let pct = Math.min((mod.current/mod.target)*100, 100).toFixed(1);
                
                let subHtml = `<div class="sub-list" id="sublist-${mIndex}">
                    <button class="edit-sub-btn" onclick="openTargetModal(${mIndex}, event)">✏️ 调整细分目标时间</button>`;
                
                mod.subs.forEach((sub, sIndex) => {
                    let displayTarget = sub.name.includes("历史记录") ? "0" : sub.t + "h";
                    subHtml += `<div class="sub-item">
                        <div style="flex:1"><div class="sub-name">${sub.name}</div></div>
                        <div class="sub-stat">${sub.c.toFixed(1)} / ${displayTarget}</div>
                        <button class="add-btn" onclick="openTimeModal(${mIndex}, ${sIndex}, event)">+</button>
                    </div>`;
                });
                subHtml += `</div>`;

                list.innerHTML += `
                    <div class="card">
                        <div class="card-header" onclick="toggleSub(${mIndex})">
                            <div class="card-left">
                                <div class="card-title">${mod.name} <span style="font-size:12px; color:#aaa;">(点击展开▼)</span></div>
                                <div class="card-stats">进度: ${mod.current.toFixed(1)} / ${mod.target}h</div>
                                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%"></div></div>
                            </div>
                        </div>
                        ${subHtml}
                    </div>
                `;
            });

            totalTarget = Math.max(225, totalTarget);
            document.getElementById('total-done').innerText = totalDone.toFixed(1);
            document.getElementById('total-target').innerText = totalTarget.toFixed(1);
            document.getElementById('daily-progress').innerText = `${todayLogged.toFixed(1)} / ${dailyTarget} h`;

            const overview = document.getElementById('overview');
            const msg = document.getElementById('quote-msg');
            
            overview.classList.remove('bg-incomplete', 'bg-complete');

            if (dailyTarget === 0) {
                overview.classList.add('bg-complete');
                msg.innerHTML = "今日休整，养精蓄锐 🥳";
                msg.style.color = "var(--success-text)";
            } else if (todayLogged >= dailyTarget) {
                overview.classList.add('bg-complete');
                msg.innerHTML = "为者常成，行者常至 😆";
                msg.style.color = "var(--success-text)";
            } else if (todayLogged >= dailyTarget / 2) {
                overview.classList.add('bg-incomplete');
                msg.innerHTML = "行百里者半九十，继续冲！🥺";
                msg.style.color = "var(--danger-text)";
            } else {
                overview.classList.add('bg-incomplete');
                msg.innerHTML = "行百里者半九十，不能拖了！😭";
                msg.style.color = "var(--danger-text)";
            }

            localStorage.setItem('examModulesV4', JSON.stringify(modules));
            localStorage.setItem('todayLoggedV4', todayLogged);
            renderHistoryLists();
        }

        function toggleSub(idx) { document.getElementById(`sublist-${idx}`).classList.toggle('active'); }

        function openTimeModal(mIndex, sIndex, e) {
            e.stopPropagation(); actMod = mIndex; actSub = sIndex;
            document.getElementById('time-modal-title').innerText = `记录【${modules[mIndex].subs[sIndex].name}】`;
            document.getElementById('time-modal').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function commitTime(hrs) {
            modules[actMod].subs[actSub].c += hrs;
            todayLogged += hrs;
            render(); closeAllModals();
        }

        function openTargetModal(mIndex, e) {
            e.stopPropagation(); actMod = mIndex;
            const mod = modules[mIndex];
            document.getElementById('target-modal-title').innerText = `调整【${mod.name}】结构`;
            let html = '';
            mod.subs.forEach((sub, i) => {
                if(!sub.name.includes("历史记录")) {
                    html += `<div class="target-input-row"><span>${sub.name}</span> <input type="number" id="t-in-${i}" value="${sub.t}"></div>`;
                }
            });
            document.getElementById('target-input-list').innerHTML = html;
            document.getElementById('target-modal').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function saveTargets() {
            modules[actMod].subs.forEach((sub, i) => {
                let el = document.getElementById(`t-in-${i}`);
                if(el) {
                    let v = parseFloat(el.value);
                    if(!isNaN(v) && v >= 0) sub.t = v;
                }
            });
            render(); closeAllModals();
        }

        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
            document.getElementById('overlay').classList.remove('active');
        }

        function saveAndCalcRates() {
            rateInputs.forEach(id => {
                localStorage.setItem('save_'+id, document.getElementById(id).value || '');
            });
            
            const g = id => parseFloat(document.getElementById(id).value)||0;
            // 修复 Bug：去掉了尾部的 * 100
            let rawGj = (g('gj-law')*0.24 + g('gj-pol')*0.20 + g('gj-calc')*0.144 + g('gj-doc')*0.088 + g('gj-econ')*0.058 + g('gj-sci')*0.094 + g('gj-cur')*0.018) / 0.842;
            let rawZc = (g('zc-yy')*0.28 + g('zc-cs')*0.175 + g('zc-tx')*0.09 + g('zc-dy')*0.04 + g('zc-lb')*0.06 + g('zc-lj')*0.045 + g('zc-zl')*0.20 + g('zc-sl')*0.11);
            
            let finalGj = rawGj; let finalZc = rawZc;
            let len = rateHistory.gj.length;
            
            // 加权平均逻辑：近三次比重为 0.5, 0.25, 0.25
            if (len >= 2) {
                finalGj = rawGj * 0.5 + parseFloat(rateHistory.gj[len-1]) * 0.25 + parseFloat(rateHistory.gj[len-2]) * 0.25;
                finalZc = rawZc * 0.5 + parseFloat(rateHistory.zc[len-1]) * 0.25 + parseFloat(rateHistory.zc[len-2]) * 0.25;
            } else if (len === 1) {
                finalGj = rawGj * 0.6 + parseFloat(rateHistory.gj[len-1]) * 0.4;
                finalZc = rawZc * 0.6 + parseFloat(rateHistory.zc[len-1]) * 0.4;
            }

            rateHistory.labels.push(dateKey);
            rateHistory.gj.push(finalGj.toFixed(1));
            rateHistory.zc.push(finalZc.toFixed(1));
            localStorage.setItem('rateHistoryV4', JSON.stringify(rateHistory));
            
            renderHistoryLists();
            alert(`已计算加权预测分并收录！\n预测公基：${finalGj.toFixed(1)}分\n预测职测：${finalZc.toFixed(1)}分`);
        }

        function saveMockScore() {
            let gj = parseFloat(document.getElementById('mock-gj').value);
            let zc = parseFloat(document.getElementById('mock-zc').value);
            if(isNaN(gj) || isNaN(zc)) { alert('请填写完整的分数'); return; }
            
            mockHistory.labels.push(dateKey);
            mockHistory.gj.push(gj);
            mockHistory.zc.push(zc);
            localStorage.setItem('mockHistoryV4', JSON.stringify(mockHistory));
            
            renderHistoryLists();
            alert('真实成绩已收录入库！');
            document.getElementById('mock-gj').value = '';
            document.getElementById('mock-zc').value = '';
        }

        function toggleHistory(type) {
            let list = document.getElementById(type + '-history-list');
            list.classList.toggle('active');
        }

        function renderHistoryLists() {
            // 渲染预测分明细（倒序）
            let rateHtml = '';
            for(let i = rateHistory.labels.length - 1; i >= 0; i--) {
                rateHtml += `<div class="hist-row">
                    <div class="hist-date">[${rateHistory.labels[i]}]</div>
                    <div class="hist-scores">公基: ${rateHistory.gj[i]} | 职测: ${rateHistory.zc[i]}</div>
                </div>`;
            }
            document.getElementById('rate-history-list').innerHTML = rateHtml || '<div style="text-align:center; color:#999; font-size:12px;">暂无记录</div>';

            // 渲染模考明细（倒序）
            let mockHtml = '';
            for(let i = mockHistory.labels.length - 1; i >= 0; i--) {
                mockHtml += `<div class="hist-row">
                    <div class="hist-date">[${mockHistory.labels[i]}]</div>
                    <div class="hist-scores">公基: ${mockHistory.gj[i]} | 职测: ${mockHistory.zc[i]}</div>
                </div>`;
            }
            document.getElementById('mock-history-list').innerHTML = mockHtml || '<div style="text-align:center; color:#999; font-size:12px;">暂无记录</div>';
        }

        function showChart(type) {
            document.getElementById('chart-modal').classList.add('active');
            document.getElementById('overlay').classList.add('active');
            const ctx = document.getElementById('myCanvas').getContext('2d');
            if(myChart) myChart.destroy();
            
            let dataObj = type === 'rate' ? rateHistory : mockHistory;
            let titleText = type === 'rate' ? '加权正确率预测历史走势' : '真实套卷模考分数走势';

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dataObj.labels,
                    datasets: [
                        { label: '公基卷', data: dataObj.gj, borderColor: '#96D1E8', backgroundColor: 'rgba(150,209,232,0.2)', tension: 0.3, fill: true, borderWidth: 3, pointRadius: 4 },
                        { label: '职测卷', data: dataObj.zc, borderColor: '#E88A9A', backgroundColor: 'rgba(232,138,154,0.2)', tension: 0.3, fill: true, borderWidth: 3, pointRadius: 4 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    layout: { padding: { left: 10, right: 15, top: 10, bottom: 10 } },
                    plugins: { title: { display: true, text: titleText, font: {size: 15} } },
                    scales: { 
                        y: { 
                            min: 58, 
                            suggestedMax: 80 // 使用 suggestedMax 以防超常发挥被切掉
                        } 
                    }
                }
            });
        }

        updateDatesAndHP();
        render();
    </script>
</body>
</html>
